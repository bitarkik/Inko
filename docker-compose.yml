version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: pod_postgres
    environment:
      POSTGRES_USER: pod_user
      POSTGRES_PASSWORD: pod_password
      POSTGRES_DB: pod_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pod_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
