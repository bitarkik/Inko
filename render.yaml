services:
  # 1. NestJS Cloud API
  - type: web
    name: printpanda-api
    env: node
    buildCommand: npm install && cd apps/server && npx prisma generate && npm run build
    startCommand: cd apps/server && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: printpanda-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: printpanda-redis
          property: connectionString

  # 2. Redis Queue (for BullMQ Background Jobs)
  - type: redis
    name: printpanda-redis
    ipAllowList: [] # internal only
    plan: free

databases:
  # 3. PostgreSQL Database
  - name: printpanda-db
    plan: free
    postgresMajorVersion: 15
