services:
  # 1. NestJS Cloud API
  - type: web
    name: printpanda-api
    env: node
    plan: free
    buildCommand: cd apps/server && npm install --include=dev && npx prisma generate && npm run build
    startCommand: cd apps/server && npx prisma db push --accept-data-loss && node dist/seed.js && npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: printpanda-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: printpanda-redis
          property: connectionString
      - key: R2_ENDPOINT
        value: "https://d3bdc781bc361c5db39d126fa1c49f50.r2.cloudflarestorage.com"
      - key: R2_ACCESS_KEY_ID
        value: "c05ebbb14421e03c048d5e59e48936ea"
      - key: R2_SECRET_ACCESS_KEY
        value: "dd39f4ada66944ed22b43100931eac77ecb3e364510fe9ca42aa135563a2abb5"
      - key: R2_BUCKET_NAME
        value: "printpanda-uploads"

  # 2. Redis Queue (for BullMQ Background Jobs)
  - type: redis
    name: printpanda-redis
    ipAllowList: [] # internal only
    plan: free

databases:
  # 3. PostgreSQL Database
  - name: printpanda-db
    plan: free
    postgresMajorVersion: 15
