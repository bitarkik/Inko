services:
  # 1. NestJS Cloud API
  - type: web
    name: printit-api
    env: node
    plan: free
    buildCommand: cd apps/server && npm install --include=dev && npx prisma generate && npm run build
    startCommand: cd apps/server && npx prisma db push --accept-data-loss && node dist/seed.js && npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: printpanda-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: printpanda-redis
          property: connectionString
      - key: R2_ENDPOINT
        value: "https://d3bde781be361e5db39d126fa1e49f50.r2.cloudflarestorage.com"
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: "printpanda-uploads"

  # 2. Redis Queue (for BullMQ Background Jobs)
  - type: redis
    name: printpanda-redis
    ipAllowList: [] # internal only
    plan: free

databases:
  # 3. PostgreSQL Database
  - name: printpanda-db
    plan: free
    postgresMajorVersion: 15
