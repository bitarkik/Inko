name: Build Desktop Agent

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd apps/desktop-agent
          npm install

      - name: Build Electron App
        run: |
          cd apps/desktop-agent
          npm run build

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PrintPanda-Installer
          path: apps/desktop-agent/release/*.exe
